name: Collect official UC packages batch 10

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-official-data-batch10.yml'
      - 'UC_dataset/sources/cloud_collection_2026-10-18_batch10.json'
      - 'UC_dataset/sources/collect_on_github.py'
      - 'UC_dataset/sources/verify_release_identity.py'

permissions:
  contents: write

concurrency:
  group: official-uc-collection-batch10
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: official-data-2026-10-18-batch10
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check whether this immutable batch is already published
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            if python -c 'import json,sys; sys.exit(json.load(open(sys.argv[1]))["isDraft"])' "$RUNNER_TEMP/release.json"; then
              echo 'published=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Collect original data without parameter checks or solving
        if: steps.existing.outputs.published != 'true'
        run: |
          python UC_dataset/sources/collect_on_github.py \
            --manifest UC_dataset/sources/cloud_collection_2026-10-18_batch10.json \
            --output "$RUNNER_TEMP/uc-release"
      - name: Verify every packaged file matches license-audited SHA-256
        if: steps.existing.outputs.published != 'true'
        run: |
          python UC_dataset/sources/verify_release_identity.py \
            --manifest UC_dataset/sources/cloud_collection_2026-10-18_batch10.json \
            --output "$RUNNER_TEMP/uc-release"
      - name: Upload original packages and provenance to repository Release
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft \
              --title '官方 UC 原始数据包：2026-10-18 批次 10' \
              --notes-file UC_dataset/sources/cloud_release_notes_batch10.md
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/uc-release/"* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
